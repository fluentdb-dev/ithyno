name: ithy-opsx-dispatch
namespace: ithy-opsx
command: dispatch
description: >-
  Dispatch the code / review / verify workers for the given change.
  This is the prompt the persistent Manager (a live-shell session
  declared in agents.yaml with roles: [manager]) evaluates when the
  Kanban Start button injects the string into the terminal PTY.
  Advances the change through proposed → coded → reviewed → done by
  resolving execution mode, setting up the worktree if needed,
  dispatching each stage's worker via the Dispatch helper protocol
  (agmsg for eligible live-shell workers, compatible same-CLI native
  delegation through Claude Task/Agent, Agy invoke_subagent, or Codex
  spawn_agent/wait_agent, and AgentRunner otherwise), judging review /
  verify by the 3-stage success contract, and looping code↔review until
  pass or MAX_REWORK_ROUNDS.
supports:
  - claude
  - codex
  - antigravity
  - cursor
  - gemini
  - copilot
  - opencode
capabilities_required:
  - subagent_spawn
  - bash
  - file_write
per_cli:
  claude:
    # The upstream /ithy-opsx:dispatch command that this skill IS.
    upstream_command: /ithy-opsx:dispatch
    # Category and tags for Claude Code's command picker,
    # matching the existing .claude/commands/ithy-opsx/dispatch.md
    # frontmatter so the ported skill surface is identical to the
    # hand-authored source.
    category: Workflow
    tags: [workflow, dispatch, manager, agmsg, phase-4]

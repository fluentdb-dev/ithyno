agents:
  - name: claude
    mode: live-shell
    roles:
      - code
    description: Implements the change using Claude Code via /opsx:apply (apply
      only). Manager commits the resulting tree on the agent branch after
      receiving the worker's stage:code status:done message, so the worker never
      enters an interactive commit prompt.
    command: claude
    args:
      - --dangerously-skip-permissions
      - --model
      - sonnet
    prompts:
      code: /opsx:apply ${change_id}
  - name: pptr
    mode: live-shell
    roles:
      - manager
    command: claude
    args:
      - --resume
  - name: copilot-review
    mode: live-shell
    roles:
      - review
    command: copilot
    args:
      - --yolo
      - -s
    prompts:
      review: /ithy-opsx:review ${change_id}
parallelExecution: true
agmsg:
  team: openspec-ui

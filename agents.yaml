agents:
  - name: claude
    mode: single-prompt
    roles:
      - code
    description: Implements the change using Claude Code via /ithy-opsx:apply
      (implementation + auto commit on the agent branch).
    command: claude
    args:
      - --dangerously-skip-permissions
      - --model
      - sonnet
    prompts:
      code: /ithy-opsx:apply ${change_id}
  - name: pptr
    mode: live-shell
    roles:
      - manager
    command: claude
    args:
      - --resume
      - 6f91588b-6030-4c63-b288-61f17794d82c
  - name: copilot-review
    mode: single-prompt
    roles:
      - review
    command: copilot
    args:
      - --yolo
      - -s
    prompts:
      review: /opsx:review ${change_id}

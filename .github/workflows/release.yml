name: Release Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # `npm ci` is the standard install path, but electron-builder's
      # app-builder-bin ships its platform-specific binary via optional
      # dependencies. On some CI configurations npm skips them, producing
      # ENOENT at package time. `--include=optional` is a no-op when the
      # dependency isn't marked optional and a fix when it is.
      - name: Install dependencies
        run: npm ci --include=optional

      # Defensive: rebuild native/prebuild artifacts so electron-builder's
      # own platform binary is definitely present before it runs.
      - name: Rebuild electron-builder platform binaries
        run: npm rebuild app-builder-bin || true

      - name: Release build
        run: npm run release:build

      - name: Upload artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ithyno-${{ matrix.os }}-${{ github.sha }}
          path: |
            vscode-extension/ithyno-*.vsix
            electron/dist/ithyno-*.dmg
            electron/dist/ithyno-*.exe
            electron/dist/ithyno-*.AppImage
          if-no-files-found: warn

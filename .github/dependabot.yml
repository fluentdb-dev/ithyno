version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Major upgrades need individual compatibility review. Dependabot's
      # grouped security updates can otherwise include majors even though the
      # regular groups above are limited to minor and patch releases.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Tokyo
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
